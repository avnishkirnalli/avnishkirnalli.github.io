<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Avnish Kirnalli</title>
  <meta name="description"
    content="Writing by Avnish Kirnalli — systems, graphics, AI/ML, tools, and occasional longer notes.">
  <meta property="og:title" content="Blog — Avnish Kirnalli">
  <meta property="og:description" content="Writing by Avnish Kirnalli on systems, AI/ML, and tools.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://avnishkirnalli.github.io/blog.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background-color: #fff;
      font-size: 16px;
      margin: 0;
      padding: 0;
    }

    a {
      color: #0056b3;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 24px;
    }

    /* ── Nav ── */
    .topnav {
      padding: 20px 24px 0;
      max-width: 800px;
      margin: 0 auto;
    }

    .back-link {
      font-size: 0.88rem;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover {
      color: #0056b3;
      text-decoration: none;
    }

    /* ── Header ── */
    .blog-header {
      margin-top: 36px;
      margin-bottom: 8px;
    }

    .blog-header h1 {
      font-size: 2rem;
      margin: 0 0 6px 0;
    }

    .blog-header p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
    }

    /* ── Post list ── */
    #posts-root {
      margin-top: 32px;
    }

    .post-item {
      padding: 20px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .post-item:last-child {
      border-bottom: none;
    }

    .post-meta {
      font-size: 0.82rem;
      color: #999;
      margin-bottom: 4px;
    }

    .post-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      line-height: 1.3;
    }

    .post-title a {
      color: #111;
      text-decoration: none;
    }

    .post-title a:hover {
      color: #0056b3;
      text-decoration: none;
    }

    .post-description {
      font-size: 0.93rem;
      color: #555;
      line-height: 1.55;
      margin: 0 0 8px 0;
    }

    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .post-tag {
      font-size: 0.74rem;
      color: #888;
      background: #f4f4f4;
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 36px 20px;
      color: #aaa;
      font-size: 0.82rem;
      border-top: 1px solid #eee;
      margin-top: 48px;
    }
  </style>
</head>

<body>

  <div class="topnav">
    <a href="index.html" class="back-link">← avnishkirnalli.github.io</a>
  </div>

  <div class="container">

    <div class="blog-header">
      <h1>Blog</h1>
      <p>Beginner to writing blogs. I plan to write about things I'm learning and things I'm building.</p>
    </div>

    <hr>

    <div id="posts-root">
      <p style="color:#aaa; font-size:0.9rem;">Loading posts…</p>
    </div>

  </div><!-- .container -->

  <div class="footer">
    &copy; 2026 Avnish Kirnalli &nbsp;·&nbsp; Built with plain HTML &amp; CSS &nbsp;·&nbsp; <a href="index.html"
      style="color:#bbb;">portfolio</a>
  </div>

  <script>
    function formatDate(iso) {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    fetch('blog/posts.json')
      .then(function (r) { return r.json(); })
      .then(function (posts) {
        var root = document.getElementById('posts-root');
        if (!posts || !posts.length) {
          root.innerHTML = '<p style="color:#aaa;">No posts yet — check back soon.</p>';
          return;
        }

        // Reverse the order of the entries in the .json file to put latest ones at top
        posts.reverse();

        root.innerHTML = posts.map(function (p) {
          var tagsHtml = (p.tags && p.tags.length)
            ? '<div class="post-tags">' +
            p.tags.map(function (t) {
              return '<span class="post-tag">' + t + '</span>';
            }).join('') +
            '</div>'
            : '';

          var postKey = p.file.split('/').pop();
          fetch('https://countapi.mileshilliard.com/api/v1/get/avnishkirnalli_github_io_post_' + postKey)
            .then(function(res) { return res.json(); })
            .then(function(data) {
              var el = document.getElementById('views-' + postKey);
              if (el) el.innerHTML = ' &middot; ' + (data.value || 0) + ' views';
            }).catch(function(e){});

          return [
            '<div class="post-item">',
            '  <div class="post-meta">' + formatDate(p.date) + '<span id="views-' + postKey + '"></span></div>',
            '  <h2 class="post-title"><a href="blog/post.html?file=' + encodeURIComponent(p.file) + '">' + p.title + '</a></h2>',
            p.description ? '  <p class="post-description">' + p.description + '</p>' : '',
            tagsHtml,
            '</div>'
          ].join('\n');
        }).join('\n');
      })
      .catch(function (err) {
        var root = document.getElementById('posts-root');
        root.innerHTML = '<p style="color:#c00;">Could not load posts. ' +
          'If viewing via file://, run: <code>python3 -m http.server 8000</code></p>';
        console.error(err);
      });
  </script>

</body>

</html>

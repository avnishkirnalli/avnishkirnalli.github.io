<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title and meta are set dynamically once the post loads -->
  <title>Post — Avnish Kirnalli</title>
  <link rel="canonical" href="https://avnishkirnalli.github.io/blog/post.html">
  <!-- marked.js from CDN — the only external dependency in the whole site -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      color: #222;
      background-color: #fff;
      font-size: 16px;
      margin: 0;
      padding: 0;
    }

    a {
      color: #0056b3;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ── Nav ── */
    .topnav {
      padding: 20px 24px 0;
      max-width: 760px;
      margin: 0 auto;
    }

    .back-link {
      font-size: 0.88rem;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover {
      color: #0056b3;
      text-decoration: none;
    }

    /* ── Post wrapper ── */
    .post-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }

    /* ── Post header ── */
    .post-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .post-date {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 8px;
    }

    .post-header h1 {
      font-size: 1.9rem;
      margin: 0 0 12px 0;
      line-height: 1.25;
    }

    .post-tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .post-tag {
      font-size: 0.74rem;
      color: #888;
      background: #f4f4f4;
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* ── Post body (Markdown output) ── */
    #post-body {
      font-size: 1rem;
      line-height: 1.75;
      color: #2a2a2a;
    }

    #post-body h1,
    #post-body h2,
    #post-body h3,
    #post-body h4 {
      margin-top: 2em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    #post-body h1 {
      font-size: 1.6rem;
    }

    #post-body h2 {
      font-size: 1.3rem;
    }

    #post-body h3 {
      font-size: 1.1rem;
    }

    #post-body p {
      margin: 0 0 1.2em 0;
    }

    #post-body ul,
    #post-body ol {
      padding-left: 24px;
      margin: 0 0 1.2em 0;
    }

    #post-body li {
      margin-bottom: 0.4em;
    }

    #post-body code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.88em;
      background: #f5f5f5;
      padding: 2px 5px;
      border-radius: 3px;
      color: #333;
    }

    #post-body pre {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 16px 18px;
      overflow-x: auto;
      margin: 0 0 1.2em 0;
    }

    #post-body pre code {
      background: none;
      padding: 0;
      font-size: 0.87em;
    }

    #post-body blockquote {
      border-left: 3px solid #ddd;
      padding-left: 16px;
      color: #666;
      margin: 0 0 1.2em 0;
    }

    #post-body hr {
      border: 0;
      border-top: 1px solid #e0e0e0;
      margin: 2em 0;
    }

    #post-body img,
    #post-body video,
    #post-body iframe {
      max-width: 100%;
      border-radius: 6px;
    }

    #post-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 1.2em 0;
      font-size: 0.93rem;
    }

    #post-body th,
    #post-body td {
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      text-align: left;
    }

    #post-body th {
      background: #f8f8f8;
      font-weight: 600;
    }

    /* ── Error / loading states ── */
    .state-msg {
      color: #aaa;
      font-size: 0.95rem;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 36px 20px;
      color: #aaa;
      font-size: 0.82rem;
      border-top: 1px solid #eee;
      margin-top: 48px;
    }

    @media (max-width: 600px) {
      .post-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="topnav">
    <a href="../blog.html" class="back-link">← all posts</a>
  </div>

  <div class="post-wrap">

    <div id="post-header-placeholder"></div>
    <div id="post-body">
      <p class="state-msg">Loading…</p>
    </div>

  </div><!-- .post-wrap -->

  <div class="footer">
    &copy; 2026 Avnish Kirnalli &nbsp;·&nbsp; Built with plain HTML &amp; CSS &nbsp;·&nbsp; <a href="../index.html"
      style="color:#bbb;">Portfolio</a> &nbsp;·&nbsp; <a href="../blog.html" style="color:#bbb;">Blog</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get('file');

      if (!file) {
        showError('No post specified. <a href="../blog.html">Go back to all posts.</a>');
        return;
      }

      // Sanitise file path — allow alphanumeric, hyphens, underscores, and forward slashes (for subdirectory paths)
      if (!/^[\w-]+(\/[\w-]+)*$/.test(file)) {
        showError('Invalid post file.');
        return;
      }

      // Load post manifest to get metadata (title, date, tags)
      fetch('../blog/posts.json')
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          var meta = posts.find(function (p) { return p.file === file; });

          // Load the Markdown file
          return fetch('../blog/' + file + '.md')
            .then(function (r) {
              if (!r.ok) throw new Error('Post not found');
              return r.text();
            })
            .then(function (md) {
              renderPost(meta, md);
            });
        })
        .catch(function (err) {
          showError('Could not load post. ' +
            'If viewing via file://, run: <code>python3 -m http.server 8000</code>');
          console.error(err);
        });

      function formatDate(iso) {
        var d = new Date(iso + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      }

      function renderPost(meta, md) {
        // Update page title
        if (meta && meta.title) {
          document.title = meta.title + ' — Avnish Kirnalli';
        }

        // Render header
        var headerEl = document.getElementById('post-header-placeholder');
        if (meta) {
          var tagsHtml = (meta.tags && meta.tags.length)
            ? '<div class="post-tag-row">' +
            meta.tags.map(function (t) {
              return '<span class="post-tag">' + t + '</span>';
            }).join('') + '</div>'
            : '';

          headerEl.className = 'post-header';
          headerEl.innerHTML = [
            meta.date ? '<div class="post-date">' + formatDate(meta.date) + '<span id="post-views"></span></div>' : '',
            '<h1>' + meta.title + '</h1>',
            tagsHtml
          ].join('');

          var postKey = file.split('/').pop();
          fetch('https://countapi.mileshilliard.com/api/v1/hit/avnishkirnalli_github_io_post_' + postKey)
            .then(function(res) { return res.json(); })
            .then(function(data) {
              var viewEl = document.getElementById('post-views');
              if (viewEl) viewEl.innerHTML = ' &middot; ' + (data.value || 0) + ' views';
            }).catch(function(e) { console.error('CountAPI error:', e); });
        }

        // Render Markdown body
        var bodyEl = document.getElementById('post-body');
        if (typeof marked !== 'undefined') {
          // marked v4+ uses marked.parse(); v3 uses marked()
          var html = (marked.parse || marked)(md, { gfm: true, breaks: true });
          bodyEl.innerHTML = html;

          // Re-evaluate script tags so embeds (like Twitter, CodePen, etc) can load
          var scripts = bodyEl.querySelectorAll('script');
          for (var i = 0; i < scripts.length; i++) {
            var oldScript = scripts[i];
            var newScript = document.createElement('script');
            for (var j = 0; j < oldScript.attributes.length; j++) {
              var attr = oldScript.attributes[j];
              newScript.setAttribute(attr.name, attr.value);
            }
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          }
        } else {
          // marked failed to load — show raw text as a fallback
          bodyEl.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;">' + escHtml(md) + '</pre>';
        }
      }

      function showError(msg) {
        document.getElementById('post-body').innerHTML = '<p style="color:#c00;">' + msg + '</p>';
      }

      function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    })();
  </script>

</body>

</html>
